<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Ingresar')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><div class="auth-shell"><div th:replace="~{fragments :: progress(2)}"></div><div class="auth-modal"><span class="eyebrow">BIENVENIDO A TU IMPERIO</span><h1>Ingresa a tu cuenta</h1><p>Gestiona tu membresía y sigue avanzando.</p><div th:replace="~{fragments :: selected}"></div><div class="auth-tabs"><a class="active" href="/login">Ingresar</a><a href="/register">Registrarme</a></div><p class="error-banner" role="alert" th:if="${param.error}">Correo, DNI o contraseña incorrectos.</p><form th:action="@{/login}" method="post"><label class="field"><span>Correo o DNI</span><input name="login" required autocomplete="username" maxlength="160"></label><label class="field"><span>Contraseña</span><input name="password" id="password" type="password" required autocomplete="current-password"></label><button type="button" class="text-link" data-password="password">Mostrar contraseña</button><button class="btn btn-primary full">Ingresar →</button></form><a class="text-link" href="/forgot">Olvidé mi contraseña</a><p class="field-hint">El DNI identifica tu cuenta; nunca se usa como contraseña.</p></div></div></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
