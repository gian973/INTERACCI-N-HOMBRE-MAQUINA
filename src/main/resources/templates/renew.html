<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Renovar')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><nav th:replace="~{fragments :: clientnav}"></nav><div class="page-title"><div><span class="eyebrow">SIGUE AVANZANDO</span><h1>Renovar o cambiar plan</h1><p>Selecciona tu plan. Verás el resumen de vigencia antes de enviar el pago.</p></div></div><div class="current-plan-strip"><b>Los días pendientes se conservan</b><span>Base para la ampliación: <strong th:text="${@ui.date(from)}"></strong></span></div><div class="plan-grid"><article class="plan-card" th:each="p:${plans}"><h3 th:text="${p.name}"></h3><p th:text="${p.months}+' mes(es)'"></p><div class="price"><small>S/</small><strong th:text="${p.price}"></strong></div><p>Importe total</p><p>Vencimiento propuesto: <b th:text="${@ui.date(from.plusMonths(p.months))}"></b></p><a class="btn btn-primary" th:href="@{/choose/{id}(id=${p.id})}">Revisar resumen →</a></article></div></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
