<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Estado del pago')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><div th:if="${isAdmin}"><nav th:replace="~{fragments :: adminnav}"></nav></div><div th:unless="${isAdmin}" th:insert="~{fragments :: progress(4)}"></div><section class="confirmation-card" th:classappend="${payment.status=='CONFIRMED'?'confirmed':''}"><span class="eyebrow" th:text="'OPERACIÓN PAG-'+${payment.id}"></span><h1 th:text="${payment.status=='CONFIRMED'?'Pago confirmado':payment.status=='REJECTED'?'Pago rechazado':'Pago recibido'}"></h1><span class="status" th:classappend="'status-'+${@ui.tone(payment.status)}" th:text="${@ui.label(payment.status)}"></span><p th:if="${payment.status=='PENDING'}">Tu comprobante está pendiente de revisión. Tu membresía mantiene su vigencia actual.</p><p class="demo-data" th:if="${payment.method=='CARD_TEST'}">Tarjeta de prueba · pago simulado. No se realizó un cobro real.</p><p class="payment-branch"><strong>Sede: </strong><span th:text="${payment.branchLabel}"></span></p><div class="confirmation-details"><div><span>PLAN</span><b th:text="${payment.planName}"></b></div><div><span>DURACIÓN / TOTAL</span><b th:text="${payment.months}+' mes(es) · S/ '+${payment.amount}"></b></div><div><span>MÉTODO</span><b th:text="${@ui.label(payment.method)}"></b></div><div><span>VENCIMIENTO APLICADO</span><b th:text="${@ui.date(payment.appliedUntil)}"></b></div></div><p th:if="${payment.operationNumber}" th:text="'N.º operación: '+${payment.operationNumber}"></p><ul class="benefit-list"><li th:each="b:${benefits}" th:text="${b.label}"></li></ul><div class="payment-actions"><a th:if="${file}" class="btn btn-secondary" th:href="@{/files/{id}(id=${file.id})}">Descargar comprobante</a><a class="btn btn-primary" th:href="${isAdmin?'/admin/payments':'/account'}">Volver al panel →</a></div></section><section th:if="${isAdmin and payment.status=='PENDING'}" class="card review-form"><h2>Revisar pago manual</h2><form th:action="@{/admin/payments/{id}/review(id=${payment.id})}" method="post"><label class="field"><span>Comentario / motivo de rechazo</span><textarea name="comment" maxlength="1000"></textarea></label><button class="btn btn-primary" name="approve" value="true">Aprobar pago</button><button class="btn btn-danger" name="approve" value="false">Rechazar pago</button></form></section><section class="card"><div th:replace="~{fragments :: reviews}"></div></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
