<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Registrarse')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><div class="auth-shell"><div th:replace="~{fragments :: progress(2)}"></div><div class="auth-modal"><span class="eyebrow">EMPIEZA HOY</span><h1>Crea tu cuenta</h1><div th:replace="~{fragments :: selected}"></div><div class="auth-tabs"><a href="/login">Ingresar</a><a class="active" href="/register">Registrarme</a></div><form th:action="@{/register}" method="post" th:object="${form}"><div class="error-banner" role="alert" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label class="field"><span class="field-label">Nombre completo</span><input type="text" th:field="*{name}" required autocomplete="name" maxlength="100"><span class="error-text" th:errors="*{name}"></span></label><div class="form-grid"><label class="field"><span class="field-label">DNI</span><input type="text" th:field="*{dni}" required pattern="[0-9]{8}" maxlength="8" inputmode="numeric"><span class="error-text" th:errors="*{dni}"></span></label><label class="field"><span class="field-label">Teléfono</span><input type="tel" th:field="*{phone}" required autocomplete="tel"><span class="error-text" th:errors="*{phone}"></span></label></div><label class="field"><span class="field-label">Correo electrónico</span><input type="email" th:field="*{email}" required autocomplete="email" maxlength="160"><span class="error-text" th:errors="*{email}"></span></label><div class="form-grid"><label class="field"><span class="field-label">Contraseña</span><input type="password" th:field="*{password}" required minlength="10" maxlength="72" autocomplete="new-password"><span class="error-text" th:errors="*{password}"></span></label><label class="field"><span class="field-label">Confirma tu contraseña</span><input type="password" th:field="*{confirmation}" required autocomplete="new-password"><span class="error-text" th:errors="*{confirmation}"></span></label></div><button type="button" class="text-link" data-password="password">Mostrar contraseña</button><p class="field-hint">Entre 10 y 72 caracteres. Usa una contraseña diferente a tu DNI.</p><button class="btn btn-primary full">Crear cuenta →</button></form></div></div></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
