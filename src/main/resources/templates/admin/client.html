<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Cliente')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><nav th:replace="~{fragments :: adminnav}"></nav><div class="page-title"><div><span class="eyebrow">CLIENTE</span><h1><span th:text="${customer.name}"></span></h1><p></p></div></div><section class="card"><p th:text="'DNI: '+${customer.dni}+' · '+${customer.email}+' · '+${customer.phone}"></p><p th:if="${membership}" th:text="'Membresía con vencimiento: '+${@ui.date(membership.expiresOn)}"></p><p th:if="${membership}">Sede: <strong th:text="${@ui.branch(membership.branchId)}"></strong></p><p th:unless="${membership}">Sin membresía.</p></section><section class="card"><h2>Pagos</h2><article class="request-item" th:each="p:${payments}"><a th:href="@{/admin/payments/{id}(id=${p.id})}" th:text="'PAG-'+${p.id}+' · '+${p.planName}+' · '+${p.branchLabel}+' · S/ '+${p.amount}"></a> <span class="status" th:classappend="'status-'+${@ui.tone(p.status)}" th:text="${@ui.label(p.status)}"></span></article><p th:if="${#lists.isEmpty(payments)}">Sin pagos.</p></section><section class="card"><h2>Solicitudes</h2><article class="request-item" th:each="r:${requests}"><a th:href="@{/admin/requests/{id}(id=${r.id})}" th:text="'SOL-'+${r.id}+' · '+${@ui.label(r.kind)}"></a> <span class="status" th:classappend="'status-'+${@ui.tone(r.status)}" th:text="${@ui.label(r.status)}"></span></article><p th:if="${#lists.isEmpty(requests)}">Sin solicitudes.</p></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
