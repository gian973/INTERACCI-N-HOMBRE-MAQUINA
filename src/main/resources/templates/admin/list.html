<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Gestión')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><nav th:replace="~{fragments :: adminnav}"></nav><div class="admin-title"><div class="page-title"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1 th:text="${section=='clients'?'Clientes':section=='payments'?'Pagos':section=='requests'?'Solicitudes':section=='plans'?'Planes':section=='reminders'?'Recordatorios':'Auditoría'}"></h1><p th:text="${total}+' registros encontrados'"></p></div></div><a class="btn btn-primary" th:if="${section=='plans'}" href="/admin/plan">Crear plan +</a></div><form class="card filter-grid" method="get" th:action="@{/admin/{s}(s=${section})}"><label class="field"><span>Buscar cliente, DNI, nombre o acción</span><input name="q" th:value="${q}" maxlength="100"></label><label class="field" th:if="${section=='payments' or section=='requests' or section=='reminders'}"><span>Estado</span><select name="status"><option value="">Todos</option><option th:each="v:${section=='payments'?{'PENDING','CONFIRMED','REJECTED'}:section=='requests'?{'SENT','IN_REVIEW','APPROVED','REJECTED'}:{'SCHEDULED','SIMULATED','SENT','CANCELLED','FAILED'}}" th:value="${v}" th:text="${@ui.label(v)}" th:selected="${v==filterStatus}"></option></select></label><label class="field" th:if="${section=='requests'}"><span>Tipo</span><select name="kind"><option value="">Todos</option><option value="HEALTH" th:selected="${kind=='HEALTH'}">Salud</option><option value="TRAVEL" th:selected="${kind=='TRAVEL'}">Viaje</option></select></label><label class="field" th:if="${section!='plans'}"><span>Desde</span><input type="date" name="from" th:value="${from}"></label><label class="field" th:if="${section!='plans'}"><span>Hasta</span><input type="date" name="to" th:value="${to}"></label><button class="btn btn-primary">Filtrar</button></form><section class="card"><div class="table-wrap"><table>
<thead><tr th:switch="${section}"><th>ID</th><th th:text="${section=='audit'?'Actor / acción':'Cliente / nombre'}"></th><th>Detalle</th><th>Estado / fecha</th><th>Acción / información</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.id}"></td><th:block th:switch="${section}">
<th:block th:case="'clients'"><td><b th:text="${r.name}"></b><br><span th:text="${r.email}"></span></td><td th:text="${r.dni}"></td><td th:text="${@ui.date(r.createdAt)}"></td><td><a th:href="@{/admin/clients/{id}(id=${r.id})}">Ver cliente →</a></td></th:block>
<th:block th:case="'plans'"><td th:text="${r.name}"></td><td th:text="${r.months}+' mes(es) · S/ '+${r.price}"></td><td th:text="${r.active?'Activo':'Inactivo'}"></td><td><a th:href="@{/admin/plans/{id}(id=${r.id})}">Editar →</a></td></th:block>
<th:block th:case="'payments'"><td th:text="${@ui.user(r.userId)}"></td><td th:text="${r.planName}+' · S/ '+${r.amount}"></td><td><span class="status" th:classappend="'status-'+${@ui.tone(r.status)}" th:text="${@ui.label(r.status)}"></span></td><td><a th:href="@{/admin/payments/{id}(id=${r.id})}">Revisar →</a></td></th:block>
<th:block th:case="'requests'"><td th:text="${@ui.user(r.userId)}"></td><td><span th:text="${@ui.label(r.kind)}"></span><br><span th:text="${@ui.date(r.startsOn)}+' — '+${@ui.date(r.endsOn)}"></span></td><td><span class="status" th:classappend="'status-'+${@ui.tone(r.status)}" th:text="${@ui.label(r.status)}"></span></td><td><a th:href="@{/admin/requests/{id}(id=${r.id})}">Revisar →</a></td></th:block>
<th:block th:case="'reminders'"><td th:text="${@ui.user(r.userId)}"></td><td th:text="${r.daysBefore}+' día(s) antes · vence '+${@ui.date(r.expiryDate)}"></td><td><span class="status" th:classappend="'status-'+${@ui.tone(r.status)}" th:text="${@ui.label(r.status)}"></span></td><td th:text="'Programado para '+${@ui.date(r.dueOn)}"></td></th:block>
<th:block th:case="'audit'"><td><b th:text="${@ui.user(r.actorId)}"></b><br><span th:text="${r.action}"></span></td><td th:text="${r.targetType}+' #'+${r.targetId}"></td><td th:text="${@ui.date(r.createdAt)}"></td><td th:text="${r.detail}"></td></th:block>
</th:block></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="empty-state">No hay registros para estos filtros.</td></tr></tbody></table></div><nav class="pagination"><a th:if="${page>0}" th:href="@{/admin/{s}(s=${section},page=${page-1},q=${q},status=${filterStatus},kind=${kind},from=${from},to=${to})}">← Anterior</a><span th:text="'Página '+${page+1}"></span><a th:if="${hasNext}" th:href="@{/admin/{s}(s=${section},page=${page+1},q=${q},status=${filterStatus},kind=${kind},from=${from},to=${to})}">Siguiente →</a></nav></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
