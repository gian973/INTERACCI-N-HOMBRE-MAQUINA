<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Gestionar plan')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container narrow"><div th:replace="~{fragments :: notices}"></div><nav th:replace="~{fragments :: adminnav}"></nav><div class="page-title"><div><span class="eyebrow">CATÁLOGO</span><h1>Gestionar plan</h1><p>Los cambios se aplican a futuras contrataciones.</p></div></div><section class="card"><form th:action="@{/admin/plan}" method="post" th:object="${form}"><input type="hidden" name="id" th:value="${planId}"><div class="error-banner" role="alert" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label class="field"><span class="field-label">Nombre del plan</span><input type="text" th:field="*{name}" required maxlength="100"><span class="error-text" th:errors="*{name}"></span></label><div class="form-grid"><label class="field"><span class="field-label">Duración en meses calendario</span><input type="number" th:field="*{months}" required min="1" max="36"><span class="error-text" th:errors="*{months}"></span></label><label class="field"><span class="field-label">Importe total S/</span><input type="number" th:field="*{price}" required min="0.01" step="0.01"><span class="error-text" th:errors="*{price}"></span></label></div><label class="checkbox-line"><input type="checkbox" th:field="*{active}"> Disponible para contratar</label><fieldset><legend>Beneficios del catálogo</legend><label class="checkbox-line" th:each="b:${benefits}"><input type="checkbox" name="benefitIds" th:value="${b.id}" th:checked="${#lists.contains(chosen,b.label)}"><span th:text="${b.label}"></span></label></fieldset><div class="form-actions"><a class="btn btn-secondary" href="/admin/plans">Volver</a><button class="btn btn-primary">Guardar plan</button></div></form></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
