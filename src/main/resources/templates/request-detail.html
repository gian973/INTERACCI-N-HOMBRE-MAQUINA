<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Seguimiento')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><div th:if="${isAdmin}"><nav th:replace="~{fragments :: adminnav}"></nav></div><div class="page-title"><div><span class="eyebrow">SEGUIMIENTO</span><h1>Solicitud SOL-<span th:text="${request.id}"></span></h1><p></p></div></div><section class="card"><span class="status" th:classappend="'status-'+${@ui.tone(request.status)}" th:text="${@ui.label(request.status)}"></span><h2 th:text="${@ui.label(request.kind)}"></h2><p th:text="${@ui.date(request.startsOn)}+' — '+${@ui.date(request.endsOn)}"></p><p th:text="${request.comment}"></p><p th:if="${request.policy}" th:text="'Política aplicada: '+${request.policy}+' · Días ampliados: '+${request.extensionDays}"></p><a class="btn btn-secondary" th:if="${file}" th:href="@{/files/{id}(id=${file.id})}">Descargar adjunto</a><form class="review-form" th:if="${isAdmin and (request.status=='SENT' or request.status=='IN_REVIEW')}" th:action="@{/admin/requests/{id}/review(id=${request.id})}" method="post"><label class="field"><span>Respuesta / motivo de rechazo obligatorio</span><textarea name="comment" maxlength="1000"></textarea></label><button th:if="${request.status=='SENT'}" class="btn btn-primary" name="next" value="IN_REVIEW">Pasar a En revisión</button><th:block th:if="${request.status=='IN_REVIEW'}"><button class="btn btn-primary" name="next" value="APPROVED">Aprobar solicitud</button><button class="btn btn-danger" name="next" value="REJECTED">Rechazar solicitud</button></th:block></form></section><section class="card"><div th:replace="~{fragments :: reviews}"></div></section><a class="btn btn-secondary" th:href="${isAdmin?'/admin/requests':'/account/requests'}">Volver a solicitudes</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
