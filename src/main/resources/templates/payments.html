<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Mis pagos')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="portal-page" tabindex="-1"><div class="portal-container "><div th:replace="~{fragments :: notices}"></div><nav th:replace="~{fragments :: clientnav}"></nav><div class="page-title"><div><span class="eyebrow">MI CUENTA</span><h1>Historial de pagos</h1><p></p></div></div><section class="card"><div th:fragment="paymentTable" class="table-wrap"><table><thead><tr><th>Operación</th><th>Plan</th><th>Sede</th><th>Total</th><th>Estado</th><th>Detalle</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="'PAG-'+${p.id}"></td><td th:text="${p.planName}"></td><td th:text="${p.branchLabel}"></td><td th:text="'S/ '+${p.amount}"></td><td><span class="status" th:classappend="'status-'+${@ui.tone(p.status)}" th:text="${@ui.label(p.status)}"></span></td><td><a th:href="@{/account/payments/{id}(id=${p.id})}">Ver pago</a></td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="6">Todavía no hay pagos registrados.</td></tr></tbody></table></div><nav class="pagination"><a th:if="${page>0}" th:href="@{/account/payments(page=${page-1})}">← Anterior</a><span th:text="'Página '+${page+1}"></span><a th:if="${hasNext}" th:href="@{/account/payments(page=${page+1})}">Siguiente →</a></nav></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
