spring:
  application:
    name: imperio-gym
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/imperio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:imperio}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
  web:
    error:
      include-message: never
      include-stacktrace: never
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
logging:
  level:
    root: INFO
    "[org.springframework.web]": INFO
    "[org.springframework.security]": INFO
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.orm.jdbc.bind]": "OFF"
app:
  uploads: ${UPLOAD_DIR:.data/uploads}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@example.invalid}
  freeze-policy: ${FREEZE_POLICY:NO_EXTENSION}
  demo-password: ${DEMO_PASSWORD:Imperio2026!}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:simulated}
    token: ${WHATSAPP_TOKEN:}
    phone-id: ${WHATSAPP_PHONE_ID:}
    template: ${WHATSAPP_TEMPLATE:}
    api-version: ${WHATSAPP_API_VERSION:}
